<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiwan Destinations Explorer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for sleek sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased overflow-hidden">

    <!-- App Container -->
    <div id="app" class="flex flex-col md:flex-row h-screen w-screen overflow-hidden">

        <!-- Mobile Header Toggle -->
        <header class="md:hidden flex items-center justify-between px-5 py-4 bg-white border-b border-slate-200 z-20 shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-compass text-lg"></i>
                </div>
                <h1 class="font-bold text-slate-900 text-lg">Taiwan Explorer</h1>
            </div>
            <button id="mobile-menu-btn" class="p-2.5 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 focus:outline-none transition-colors">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
        </header>

        <!-- Sidebar / Navigation Panel -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-80 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl md:shadow-none shrink-0">
            <!-- Sidebar Header -->
            <div class="p-6 border-b border-slate-100 hidden md:flex items-center space-x-3 bg-gradient-to-r from-indigo-50/50 to-white">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-compass text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg tracking-tight">Taiwan Explorer</h1>
                    <p class="text-xs text-slate-500 font-medium">Discover scenic wonders</p>
                </div>
            </div>

            <!-- Mobile Close Button inside Sidebar -->
            <div class="flex md:hidden items-center justify-between p-6 border-b border-slate-100">
                <span class="font-bold text-slate-900 text-lg">Destinations</span>
                <button id="mobile-close-btn" class="p-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Search bar filter (Optional aesthetic touch) -->
            <div class="p-4 border-b border-slate-100">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="destination-search" placeholder="Search destinations..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>
            </div>

            <!-- Destinations List -->
            <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="destination-list">
                <!-- Populated dynamically via JavaScript -->
            </div>

            <!-- Sidebar Footer / Info -->
            <div class="p-4 border-t border-slate-100 bg-slate-50/50 text-xs text-slate-500 flex items-center justify-between">
                <span>Ready for GitHub Pages</span>
                <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 font-medium border border-emerald-200">v1.0</span>
            </div>
        </aside>

        <!-- Backdrop for mobile menu -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-20 hidden md:hidden transition-opacity"></div>

        <!-- Main Content Area: Map & Details -->
        <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-100">
            <!-- Top bar with destination metadata -->
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-xs z-10 shrink-0">
                <div class="flex items-center space-x-3">
                    <span id="header-badge" class="px-3 py-1 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded-full uppercase tracking-wider border border-indigo-100">Selected Place</span>
                    <h2 id="current-title" class="text-lg md:text-xl font-bold text-slate-900 truncate">Loading...</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <a id="external-map-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex items-center space-x-2 px-3.5 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors border border-slate-200">
                        <i class="fa-solid fa-arrow-up-right-from-square text-slate-500"></i>
                        <span>Open in Google Maps</span>
                    </a>
                </div>
            </header>

            <!-- Map Iframe Container -->
            <div class="flex-1 relative w-full h-full bg-slate-200">
                <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-slate-100/80 backdrop-blur-xs z-10 transition-opacity duration-300">
                    <div class="flex flex-col items-center space-y-3">
                        <div class="w-10 h-10 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-sm font-medium text-slate-600">Loading interactive map...</p>
                    </div>
                </div>
                <iframe id="map-iframe" src="" class="w-full h-full border-0" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" onload="hideSpinner()"></iframe>
            </div>
        </main>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Destination Data Source
        const destinations = [
            {
                id: 'houtong',
                name: 'Houtong Cat Village',
                category: 'Scenic Village',
                description: 'A famous picturesque village in Ruifang District known worldwide for its high population of friendly resident cats.',
                icon: 'fa-cat',
                embedUrl: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13888.96445647769!2d121.81883684306936!3d25.088682243009334!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x345d5ab379f5d523%3A0xde33885081c1e04a!2sHoutong%20Cat%20Village%2C%20Guangfu%20Village%2C%20Ruifang%20District%2C%20New%20Taipei%20City%2C%20Taiwan%20224!5e1!3m2!1sen!2sth!4v1794379799098!5m2!1sen!2sth',
                mapUrl: 'https://maps.google.com/?q=Houtong+Cat+Village'
            },
            {
                id: 'jiufen',
                name: 'Jiufen Old Street',
                category: 'Historic Street',
                description: 'Historic mountainside town famed for its narrow alleyways, red lanterns, traditional teahouses, and stunning coastal views.',
                icon: 'fa-store',
                embedUrl: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3471.6416257707897!2d121.84522299999999!3d25.109806!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x345d4517fafb9471%3A0x5f15825aa6a4a7d2!2sJiufen%20Old+Street!5e1!3m2!1sen!2sth!4v1794379827987!5m2!1sen!2sth',
                mapUrl: 'https://maps.google.com/?q=Jiufen+Old+Street'
            }
        ];

        let currentDestinationId = destinations[0].id;

        // DOM Elements
        const listContainer = document.getElementById('destination-list');
        const currentTitleEl = document.getElementById('current-title');
        const mapIframe = document.getElementById('map-iframe');
        const externalMapLink = document.getElementById('external-map-link');
        const loadingSpinner = document.getElementById('loading-spinner');
        const searchInput = document.getElementById('destination-search');
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileCloseBtn = document.getElementById('mobile-close-btn');

        // Render Destinations List
        function renderList(filter = '') {
            listContainer.innerHTML = '';
            const filtered = destinations.filter(d => 
                d.name.toLowerCase().includes(filter.toLowerCase()) || 
                d.category.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-sm">
                        <i class="fa-solid fa-face-sad-tear text-2xl mb-2"></i>
                        <p>No destinations found</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(dest => {
                const isSelected = dest.id === currentDestinationId;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `w-full text-left p-3.5 rounded-2xl transition-all flex items-start space-x-3.5 group relative border ${
                    isSelected 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200 border-indigo-600' 
                        : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200/80 hover:border-slate-300'
                }`;
                
                button.innerHTML = `
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition-colors ${
                        isSelected 
                            ? 'bg-white/20 text-white' 
                            : 'bg-slate-100 text-slate-600 group-hover:bg-indigo-50 group-hover:text-indigo-600'
                    }">
                        <i class="fa-solid ${dest.icon} text-base"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-0.5">
                            <span class="font-semibold text-sm truncate ${isSelected ? 'text-white' : 'text-slate-900'}">${dest.name}</span>
                            <i class="fa-solid fa-chevron-right text-xs opacity-60 ${isSelected ? 'text-white' : 'text-slate-400'}"></i>
                        </div>
                        <p class="text-xs truncate ${isSelected ? 'text-indigo-100' : 'text-slate-500'}">${dest.category}</p>
                    </div>
                `;

                button.addEventListener('click', () => {
                    selectDestination(dest.id);
                    // Close sidebar on mobile after selection
                    if (window.innerWidth < 768) {
                        toggleMobileSidebar(false);
                    }
                });

                listContainer.appendChild(button);
            });
        }

        // Select Destination
        function selectDestination(id) {
            const dest = destinations.find(d => d.id === id);
            if (!dest) return;

            currentDestinationId = id;
            currentTitleEl.textContent = dest.name;
            externalMapLink.href = dest.mapUrl;
            
            // Show spinner while iframe loads
            loadingSpinner.style.opacity = '1';
            loadingSpinner.style.display = 'flex';
            mapIframe.src = dest.embedUrl;

            renderList(searchInput.value);
        }

        // Hide Loading Spinner when iframe completes loading
        function hideSpinner() {
            loadingSpinner.style.opacity = '0';
            setTimeout(() => {
                loadingSpinner.style.display = 'none';
            }, 300);
        }

        // Mobile Sidebar Toggle
        function toggleMobileSidebar(isOpen) {
            if (isOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebarBackdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarBackdrop.classList.add('hidden');
            }
        }

        mobileMenuBtn.addEventListener('click', () => toggleMobileSidebar(true));
        mobileCloseBtn.addEventListener('click', () => toggleMobileSidebar(false));
        sidebarBackdrop.addEventListener('click', () => toggleMobileSidebar(false));

        // Search Input Event Listener
        searchInput.addEventListener('input', (e) => {
            renderList(e.target.value);
        });

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            renderList();
            selectDestination(currentDestinationId);
        });
    </script>
</body>
</html>
