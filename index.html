<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taipei Places Explorer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body
    class="bg-black text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Subtle, Modern Header -->
    <header class="w-full border-b border-zinc-800 bg-black/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-zinc-100 leading-tight">Around Taipe by アイスさん</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-grow">
        <!-- Dynamic Content Container -->
        <div id="places-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
            <!-- Dynamic content populated via script -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-zinc-800 bg-black py-6 text-center text-xs text-zinc-500">
        <p>Built with dynamic inline data &bull; Discover Taipei</p>
    </footer>

    <!-- Interactive Map Modal / Iframe Viewer -->
    <div id="map-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-xs hidden opacity-0 transition-all duration-300">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl w-full max-w-3xl mx-4 overflow-hidden transform scale-95 transition-all duration-300 flex flex-col max-h-[90vh]"
            id="modal-content">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-800 bg-zinc-950/50">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-rose-500"></div>
                    <h3 id="modal-title" class="text-base font-semibold text-zinc-100">Location Map</h3>
                </div>
                <button id="close-modal-btn"
                    class="text-zinc-400 hover:text-zinc-200 rounded-lg p-1.5 hover:bg-zinc-800 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <!-- Modal Body (Iframe) -->
            <div class="p-4 bg-zinc-950 flex-grow">
                <div class="w-full h-[450px] rounded-xl overflow-hidden bg-zinc-900 shadow-inner">
                    <iframe id="map-iframe" class="w-full h-full border-0" src="" allowfullscreen=""
                        loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic & Inline Data -->
    <script>
        // Data migrated directly from places.json
        const places = [
            {
                "title": "Houtong Cat Village",
                "images": [
                    "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9RCwnf-eqAP9SOMGViOjvHPUrvs3eP3bAKPS23NzdFtsjYd_Xd5NoM5QNZlLHbBtzXPGnAqQN8T2FtWaqTBrbDLFqrJBSwAbCli4CuAcO_gIDCy55zhl3ga2I1_WwrCwnVNMkXX=s1360-w1360-h1020-rw",
                    "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9QjmASWh-Ovz-HbRvOSPc5wc2eQJe4efZ6TsIg_fD7VINTtVwFHB3AZ_n_m_fz5WRCiEXT5829Bt7_XeJfIQ9pZQJB8l0w7s4EQ7U3Z0sfkBvzAkeUt0YakDIsIqj-Wxgp20eKa=s1360-w1360-h1020-rw"
                ],
                "description": "blablabla",
                "map_embed_url": "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13888.96445647769!2d121.81883684306936!3d25.088682243009334!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x345d5ab379f5d523%3A0xde33885081c1e04a!2sHoutong%20Cat%20Village%2C%20Guangfu%20Village%2C%20Ruifang%20District%2C%20New%20Taipei%20City%2C%20Taiwan%20224!5e1!3m2!1sen!2sth!4v1794379799098!5m2!1sen!2sth"
            },
            {
                "title": "jiufen Old Street",
                "images": [
                    "imgs/jiufen-taiwan-teahouse.jpg"
                ],
                "description": "blablabla",
                "map_embed_url": "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3471.6416257707897!2d121.84522299999999!3d25.109806!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x345d4517fafb9471%3A0x5f15825aa6a4a7d2!2sJiufen%20Old%20Street!5e1!3m2!1sen!2sth!4v1794379827987!5m2!1sen!2sth"
            }
        ];

        function isLikelyDirectImage(url) {
            if (!url) return false;
            const lower = url.toLowerCase();
            const hasImageExtension = lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.png') || lower.endsWith('.webp') || lower.endsWith('.gif') || lower.includes('googleusercontent.com');
            const isBlogLink = lower.includes('blog') || lower.includes('article') || lower.includes('girleatworld.net');
            return hasImageExtension && !isBlogLink;
        }

        function renderPlaces() {
            const container = document.getElementById('places-container');
            container.innerHTML = '';

            if (!places || places.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-zinc-900 rounded-2xl border border-zinc-800">
                        <p class="text-zinc-400 font-medium">No places found.</p>
                    </div>
                `;
                return;
            }

            places.forEach((place) => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900 rounded-2xl shadow-xs border border-zinc-800 overflow-hidden hover:shadow-xl hover:border-zinc-700 transition-all duration-300 flex flex-col justify-between group';

                // Top content section (Title & Description with Open Map Button next to Title)
                let contentDiv = document.createElement('div');
                contentDiv.className = 'p-6 flex-grow';

                contentDiv.innerHTML = `
                    <div class="flex items-center justify-between gap-4 mb-3">
                        <h2 class="text-xl font-bold text-zinc-100 group-hover:text-rose-500 transition-colors">${escapeHTML(place.title)}</h2>
                        <button class="map-btn inline-flex items-center gap-1.5 px-3 py-1.5 bg-zinc-800 hover:bg-rose-600 text-zinc-200 hover:text-white text-xs font-semibold rounded-xl transition-all shadow-sm flex-shrink-0">
                            <svg class="w-3.5 h-3.5 text-rose-400 group-hover/btn:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Open Map
                        </button>
                    </div>
                    <p class="text-zinc-400 text-sm mb-4 leading-relaxed">${escapeHTML(place.description)}</p>
                `;

                // Attach button event listener
                const btn = contentDiv.querySelector('.map-btn');
                btn.addEventListener('click', () => {
                    openMapModal(place.title, place.map_embed_url);
                });

                // Build Image Gallery Grid dynamically
                if (place.images && place.images.length > 0) {
                    const imagesWrapper = document.createElement('div');
                    imagesWrapper.className = 'grid grid-cols-2 gap-2.5 p-3 bg-zinc-950/60 rounded-xl border border-zinc-800/80';

                    place.images.forEach((imgUrl, imgIndex) => {
                        const isValidImage = isLikelyDirectImage(imgUrl);
                        const displaySrc = isValidImage ? imgUrl : `https://placehold.co/600x400/27272a/a1a1aa?text=${encodeURIComponent(place.title)}`;

                        const imgCard = document.createElement('div');
                        imgCard.className = 'relative group/img cursor-pointer overflow-hidden rounded-lg bg-zinc-800 aspect-video shadow-xs';
                        imgCard.innerHTML = `
                            <img src="${displaySrc}" alt="${escapeHTML(place.title)} photo ${imgIndex + 1}" class="w-full h-full object-cover group-hover/img:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/27272a/a1a1aa?text=Taipei+View'">
                            <div class="absolute inset-0 bg-black/0 group-hover/img:bg-black/40 transition-colors flex items-center justify-center">
                                <span class="opacity-0 group-hover/img:opacity-100 transition-opacity bg-zinc-900/95 text-zinc-100 text-[11px] font-semibold px-2.5 py-1 rounded-full shadow-md backdrop-blur-xs flex items-center gap-1 border border-zinc-700">
                                    <svg class="w-3 h-3 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                    View Map
                                </span>
                            </div>
                        `;

                        // Clicking image opens the map iframe modal
                        imgCard.addEventListener('click', () => {
                            openMapModal(place.title, place.map_embed_url);
                        });

                        imagesWrapper.appendChild(imgCard);
                    });
                    contentDiv.appendChild(imagesWrapper);
                }

                card.appendChild(contentDiv);
                container.appendChild(card);
            });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g,
                tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
            );
        }

        // Modal Controls
        function openMapModal(title, embedUrl) {
            const modal = document.getElementById('map-modal');
            const modalContent = document.getElementById('modal-content');
            const modalTitle = document.getElementById('modal-title');
            const mapIframe = document.getElementById('map-iframe');

            modalTitle.textContent = title + ' - Map';
            mapIframe.src = embedUrl;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeMapModal() {
            const modal = document.getElementById('map-modal');
            const modalContent = document.getElementById('modal-content');
            const mapIframe = document.getElementById('map-iframe');

            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                mapIframe.src = '';
            }, 300);
        }

        // Event Listeners for Modal Closing
        document.getElementById('close-modal-btn').addEventListener('click', closeMapModal);
        document.getElementById('map-modal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeMapModal();
            }
        });

        // Initialize rendering on load
        window.onload = function () {
            renderPlaces();
        };
    </script>
</body>

</html>
