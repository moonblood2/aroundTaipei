<!DOCTYPE html>
<html lang="en">

<head>

    <title>Taipei Places Explorer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body
    class="bg-black text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Subtle, Modern Header -->
    <header class="w-full border-b border-zinc-800 bg-black/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-zinc-100 leading-tight">Around Taipei by アイスさん</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-grow">
        <!-- Dynamic Content Container -->
        <div id="places-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
            <!-- Dynamic content populated via script -->
        </div>
    </main>

    <!-- Toast Notification for Copy -->
    <div id="toast"
        class="fixed bottom-6 right-6 z-50 bg-zinc-800 text-zinc-100 px-4 py-2.5 rounded-xl border border-zinc-700 shadow-2xl text-xs font-semibold opacity-0 translate-y-2 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <!-- Interactive Map Modal / Iframe Viewer -->
    <div id="map-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-xs hidden opacity-0 transition-all duration-300">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl w-full max-w-3xl mx-4 overflow-hidden transform scale-95 transition-all duration-300 flex flex-col max-h-[90vh]"
            id="modal-content">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-800 bg-zinc-950/50">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-rose-500"></div>
                    <h3 id="modal-title" class="text-base font-semibold text-zinc-100">Location Map</h3>
                </div>
                <button id="close-modal-btn"
                    class="text-zinc-400 hover:text-zinc-200 rounded-lg p-1.5 hover:bg-zinc-800 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <!-- Modal Body (Iframe) -->
            <div class="p-4 bg-zinc-950 flex-grow">
                <div class="w-full h-[450px] rounded-xl overflow-hidden bg-zinc-900 shadow-inner">
                    <iframe id="map-iframe" class="w-full h-full border-0" src="" allowfullscreen=""
                        loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Expansion Modal Viewer -->
    <div id="image-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md hidden opacity-0 transition-all duration-300">
        <div class="relative max-w-4xl max-h-[90vh] mx-4 flex flex-col items-center">
            <button id="close-image-modal-btn"
                class="absolute -top-12 right-0 text-zinc-400 hover:text-white bg-zinc-800/80 hover:bg-zinc-700 p-2 rounded-full transition-colors shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            <img id="expanded-image" src="" alt="Expanded view"
                class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border border-zinc-800">
            <p id="image-caption" class="mt-4 text-zinc-300 text-sm font-medium text-center"></p>
        </div>
    </div>

        // Color mapping configuration for each groupId
        const groupStyles = {
            0: {
                border: 'border-rose-500/40 hover:border-rose-500',
                badge: 'bg-rose-500/15 text-rose-300 border-rose-500/30',
                dot: 'bg-rose-500'
            },
            1: {
                border: 'border-amber-500/40 hover:border-amber-500',
                badge: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
                dot: 'bg-amber-500'
            },
            2: {
                border: 'border-emerald-500/40 hover:border-emerald-500',
                badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
                dot: 'bg-emerald-500'
            },
            3: {
                border: 'border-sky-500/40 hover:border-sky-500',
                badge: 'bg-sky-500/15 text-sky-300 border-sky-500/30',
                dot: 'bg-sky-500'
            }
        };

        const defaultGroupStyle = {
            border: 'border-zinc-800 hover:border-zinc-700',
            badge: 'bg-zinc-800 text-zinc-300 border-zinc-700',
            dot: 'bg-zinc-500'
        };

        function isLikelyDirectImage(url) {
            if (!url) return false;
            const lower = url.toLowerCase();
            const hasImageExtension = lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.png') || lower.endsWith('.webp') || lower.endsWith('.gif') || lower.includes('googleusercontent.com');
            const isBlogLink = lower.includes('blog') || lower.includes('article') || lower.includes('girleatworld.net');
            return hasImageExtension && !isBlogLink;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = `Copied "${text}"`;
            toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
            }, 2000);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(text);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(text);
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function renderPlaces() {
            const container = document.getElementById('places-container');
            container.innerHTML = '';

            if (!places || places.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-zinc-900 rounded-2xl border border-zinc-800">
                        <p class="text-zinc-400 font-medium">No places found.</p>
                    </div>
                `;
                return;
            }

            places.forEach((place) => {
                const groupStyle = groupStyles[place.groupId] || defaultGroupStyle;

                const card = document.createElement('div');
                card.className = `bg-zinc-900 rounded-2xl shadow-xs border ${groupStyle.border} overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col justify-between group`;

                let contentDiv = document.createElement('div');
                contentDiv.className = 'p-6 flex-grow';

                // Constructing the layout hierarchy with group badge and color coding
                contentDiv.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-3">
                        <div class="space-y-1.5 flex-grow">
                            <!-- Title Row with Copy Button & Group Badge -->
                            <div class="flex items-center justify-between gap-2 flex-wrap">
                                <div class="flex items-center gap-2">
                                    <h2 class="text-xl font-bold text-zinc-100 group-hover:text-white transition-colors">${escapeHTML(place.title)}</h2>
                                    <button class="copy-title-btn p-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-zinc-100 rounded-lg transition-colors" title="Copy Title" aria-label="Copy Title">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Chinese Title Row with Copy Button -->
                            <div class="flex items-center gap-2">
                                <span class="text-base font-medium text-zinc-300">${escapeHTML(place.chineseTitle)}</span>
                                <button class="copy-chinese-btn p-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-zinc-100 rounded-lg transition-colors" title="Copy Chinese Title" aria-label="Copy Chinese Title">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                </button>
                            </div>

                            <!-- Travel Time from Zhongli Station -->
                            <div class="flex items-center gap-1.5 text-xs font-semibold text-rose-400 pt-0.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span> ${escapeHTML(place.travelTimeFromZhongliStation)}</span>
                            </div>
                        </div>

                        <!-- Open Map Button -->
                        <button class="map-btn inline-flex items-center gap-1.5 px-3 py-1.5 bg-zinc-800 hover:bg-rose-600 text-zinc-200 hover:text-white text-xs font-semibold rounded-xl transition-all shadow-sm flex-shrink-0">
                            <svg class="w-3.5 h-3.5 text-rose-400 group-hover/btn:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Open Map
                        </button>
                    </div>
                    <p class="text-zinc-400 text-sm mb-4 leading-relaxed mt-3">${escapeHTML(place.description)}</p>
                `;

                // Attach event listeners
                contentDiv.querySelector('.map-btn').addEventListener('click', () => {
                    openMapModal(place.title, place.map_embed_url);
                });

                contentDiv.querySelector('.copy-title-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(place.title);
                });

                contentDiv.querySelector('.copy-chinese-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(place.chineseTitle);
                });

                // Build Image Gallery Grid dynamically
                if (place.images && place.images.length > 0) {
                    const imagesWrapper = document.createElement('div');
                    imagesWrapper.className = 'grid grid-cols-2 gap-2.5 p-3 bg-zinc-950/60 rounded-xl border border-zinc-800/80';

                    place.images.forEach((imgUrl, imgIndex) => {
                        const isValidImage = isLikelyDirectImage(imgUrl);
                        const displaySrc = isValidImage ? imgUrl : `https://placehold.co/600x400/27272a/a1a1aa?text=${encodeURIComponent(place.title)}`;

                        const imgCard = document.createElement('div');
                        imgCard.className = 'relative group/img cursor-pointer overflow-hidden rounded-lg bg-zinc-800 aspect-video shadow-xs';
                        imgCard.innerHTML = `
                            <img src="${displaySrc}" alt="${escapeHTML(place.title)} photo ${imgIndex + 1}" class="w-full h-full object-cover group-hover/img:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/27272a/a1a1aa?text=Taipei+View'">
                            <div class="absolute inset-0 bg-black/0 group-hover/img:bg-black/40 transition-colors flex items-center justify-center">
                                <span class="opacity-0 group-hover/img:opacity-100 transition-opacity bg-zinc-900/95 text-zinc-100 text-[11px] font-semibold px-2.5 py-1 rounded-full shadow-md backdrop-blur-xs flex items-center gap-1 border border-zinc-700">
                                    <svg class="w-3 h-3 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                                </span>
                            </div>
                        `;

                        imgCard.addEventListener('click', () => {
                            openImageModal(displaySrc, `${place.title} - Photo ${imgIndex + 1}`);
                        });

                        imagesWrapper.appendChild(imgCard);
                    });
                    contentDiv.appendChild(imagesWrapper);
                }

                card.appendChild(contentDiv);
                container.appendChild(card);
            });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g,
                tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
            );
        }

        // Map Modal Controls
        function openMapModal(title, embedUrl) {
            const modal = document.getElementById('map-modal');
            const modalContent = document.getElementById('modal-content');
            const modalTitle = document.getElementById('modal-title');
            const mapIframe = document.getElementById('map-iframe');

            modalTitle.textContent = title + ' - Map';
            mapIframe.src = embedUrl;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeMapModal() {
            const modal = document.getElementById('map-modal');
            const modalContent = document.getElementById('modal-content');
            const mapIframe = document.getElementById('map-iframe');

            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                mapIframe.src = '';
            }, 300);
        }

        // Image Expansion Modal Controls
        function openImageModal(imgSrc, captionText) {
            const modal = document.getElementById('image-modal');
            const expandedImg = document.getElementById('expanded-image');
            const imgCaption = document.getElementById('image-caption');

            expandedImg.src = imgSrc;
            imgCaption.textContent = captionText;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');

            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('expanded-image').src = '';
            }, 300);
        }

        // Event Listeners for Modals Closing
        document.getElementById('close-modal-btn').addEventListener('click', closeMapModal);
        document.getElementById('map-modal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeMapModal();
            }
        });

        document.getElementById('close-image-modal-btn').addEventListener('click', closeImageModal);
        document.getElementById('image-modal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeImageModal();
            }
        });

        // Initialize rendering on load
        window.onload = function () {
            renderPlaces();
        };
    </script>
</body>

</html>
